name: Allowlist check - todogroup (full SHA)

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: todogroup/repolinter-action@4d478dcd860571382da7d512d6dc6dd5f554fbb2 # v1.7.3
        with:
          config_url: "https://raw.githubusercontent.com/todogroup/repolinter/main/rulesets/default.json"
